<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin sách</title>
    <style>
        body {display: flex; flex-direction: column; min-height: 1000px; }
        .form-group { margin: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select {
            width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        .error { color: red; font-size: 0.9em; margin-top: 5px; display: block; }
        .btn-save, .btn-cancel {
            padding: 10px 15px; border-radius: 4px; color: #fff; text-decoration: none; border: none;
        }
        .btn-save { cursor: pointer; color: black }
        .btn-cancel { background: #f44336; margin-left: 10px; }
    </style>

</head>
<body>
    <h2 th:text="${bookReq.id == null ? 'Thêm sách mới' : 'Cập nhật sách'}"></h2>
    <form th:action="@{/book/save}" th:object="${bookReq}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Tiêu đề (*):</label>
            <input type="text" th:field="*{title}" />
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
            <label>Tác giả (*):</label>
            <input type="text" th:field="*{author}" />
            <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </div>

        <div class="form-group">
            <label>ISBN (13 chữ số) (*):</label>
            <input type="text" th:field="*{isbn}" maxlength="13" />
            <span class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
        </div>

        <div class="form-group">
            <label>Năm xuất bản (*):</label>
            <input type="number" th:field="*{publicationYear}" />
            <span class="error" th:if="${#fields.hasErrors('publicationYear')}" th:errors="*{publicationYear}"></span>
        </div>

        <div class="form-group">
            <label>Giá (VNĐ) (*):</label>
            <input type="number" step="0.01" th:field="*{price}" />
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <button type="submit" class="btn-save">Lưu lại</button>
        <a th:href="@{/book}" class="btn-cancel">Hủy</a>
    </form>
</body>
</html>
