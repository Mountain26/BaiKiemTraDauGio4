<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Device Management</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; color: #007bff; }
        .btn { padding: 8px 12px; background-color: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background-color: #dc3545; }
        .btn-secondary { background-color: #6c757d; }
        .filter-form { margin-bottom: 20px; }
        .pagination a { margin: 0 5px; padding: 5px 10px; border: 1px solid #ccc; }
        .pagination { margin-top: 20px; }
        .pagination .active { background-color: #007bff; color: white; }
        td img { max-width: 80px; height: auto; display: block; margin: 0 auto; }
        .img-cell { text-align: center; }
    </style>
</head>
<body>
    <h1>Device List</h1>

    <div class="filter-form">
        <form action="/devices" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name...">
            <select name="brandId">
                <option value="">All Brands</option>
                <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"
                        th:selected="${brandId != null && brand.id == brandId}"></option>
            </select>
            <button type="submit">Search</button>
        </form>
    </div>

    <p>
        <a href="/devices/add" class="btn">Add Device</a>
        <a href="/brands" class="btn" style="background-color: #28a745;">Manage Brands</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Device Name</th>
            <th>Model</th>
            <th>Price</th>
            <th>Date</th>
            <th>Brand</th>
            <th>Available</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="device : ${devicePage.content}">
            <td th:text="${device.id}"></td>
            <td class="img-cell">
                <img th:if="${device.productImage != null}" th:src="@{'/uploads/' + ${device.productImage}}" alt="Image">
                <img th:if="${device.productImage == null}" th:src="@{/images/default.jpg}" alt="Image">
            </td>
            <td th:text="${device.deviceName}"></td>
            <td th:text="${device.modelCode}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(device.price, 1, 2, 'COMMA')}"></td>
            <td th:text="${#temporals.format(device.manufactureDate, 'dd-MM-yyyy')}"></td>
            <td th:text="${device.brand != null ? device.brand.name : 'N/A'}"></td>
            <td th:text="${device.isAvailable ? 'Yes' : 'No'}"></td>
            <td>
                <a th:href="@{/devices/edit/{id}(id=${device.id})}" class="btn btn-secondary">Edit</a>
                <a th:href="@{/devices/delete/{id}(id=${device.id})}" class="btn btn-danger"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${devicePage.totalPages > 1}">
        <a th:if="${devicePage.hasPrevious()}" th:href="@{/devices(page=${devicePage.number - 1}, size=${devicePage.size}, keyword=${keyword}, brandId=${brandId})}">Prev</a>
        <span th:each="i : ${#numbers.sequence(0, devicePage.totalPages - 1)}">
            <a th:href="@{/devices(page=${i}, size=${devicePage.size}, keyword=${keyword}, brandId=${brandId})}"
               th:classappend="${i == devicePage.number} ? 'active'"
               th:text="${i + 1}"></a>
        </span>
        <a th:if="${devicePage.hasNext()}" th:href="@{/devices(page=${devicePage.number + 1}, size=${devicePage.size}, keyword=${keyword}, brandId=${brandId})}">Next</a>
    </div>
</body>
</html>
