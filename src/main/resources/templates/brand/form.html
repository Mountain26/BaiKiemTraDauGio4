<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brand Form</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 0.9em; }
        .btn { padding: 8px 12px; background-color: #007bff; color: white; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Brand Form</h1>
    <form th:with="actionUrl=${brand.id == null} ? '/brands/add' : '/brands/edit/' + brand.id"
          th:action="@{${actionUrl}}"
          th:object="${brand}"
          method="post">
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" th:field="*{description}">
        </div>
        <button type="submit" class="btn">Submit</button>
        <a href="/devices" class="btn" style="background-color: #6c757d;">Cancel</a>
    </form>
</body>
</html>
