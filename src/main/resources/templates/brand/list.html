<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brand List</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; color: #007bff; }
        .btn { padding: 8px 12px; background-color: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Brand List</h1>
    <p>
        <a href="/devices" class="btn">Back to Devices</a>
        <a href="/brands/add" class="btn">Add Brand</a>
    </p>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="brand : ${brands}">
            <td th:text="${brand.id}"></td>
            <td th:text="${brand.name}"></td>
            <td th:text="${brand.description}"></td>
            <td>
                <a th:href="@{/brands/edit/{id}(id=${brand.id})}">Edit</a> |
                <a th:href="@{/brands/delete/{id}(id=${brand.id})}" style="color: red;"
                   onclick="return confirm('Are you sure you want to delete this brand?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
